{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center" style="margin-top: -50px;">
        <div class="col-md-5 col-lg-4">
            
            <!-- Logo / Brand Section (Optional) -->
            <div class="text-center mb-4">
                <i class="fas fa-trophy text-warning fa-3x mb-2"></i>
                <h3 class="fw-bold text-dark">Quiz Bee System</h3>
                <p class="text-muted">Sign in to start tabulation</p>
            </div>

            <!-- Login Card -->
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Login</h4>
                    
                    <form method="POST">
                        <!-- Username -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            <label for="username"><i class="fas fa-user me-2 text-secondary"></i>Username</label>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password"><i class="fas fa-lock me-2 text-secondary"></i>Password</label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                Sign In <i class="fas fa-sign-in-alt ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Footer Text -->
            <div class="text-center mt-3 text-muted small">
                <p>Authorized personnel only.</p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
