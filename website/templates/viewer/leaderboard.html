{% extends "base.html" %}
{% block title %}Live Leaderboard{% endblock %}
{% block content %}

<style>
    /* Winner Styles (Only applied when no round is active) */
    /* Bootstrap paints cell backgrounds from --bs-table-bg, so set it on the row */
    .rank-1 { --bs-table-bg: #fffde7; border-left: 8px solid #ffd700; } /* Gold */
    .rank-2 { --bs-table-bg: #f5f5f5; border-left: 8px solid #c0c0c0; } /* Silver */
    .rank-3 { --bs-table-bg: #fff3e0; border-left: 8px solid #cd7f32; } /* Bronze */
    
    /* Make the top 3 rows pop a bit more */
    .rank-1 td, .rank-2 td, .rank-3 td {
        vertical-align: middle;
    }
</style>

<!-- Refreshed in the background by animations.js (no full page reload) -->
{% include 'viewer/leaderboard_fragment.html' %}

{% endblock %}
